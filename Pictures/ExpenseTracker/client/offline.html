<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل بالإنترنت</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }
        .offline-container{
            background:#fff;
            border-radius:24px;
            padding:40px;
            max-width:400px;
            text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }
        .offline-container .icon{
            font-size:80px;
            margin-bottom:20px;
        }
        .offline-container h1{
            color:#333;
            font-size:24px;
            margin-bottom:10px;
        }
        .offline-container p{
            color:#666;
            font-size:16px;
            line-height:1.6;
            margin-bottom:20px;
        }
        .offline-container .btn{
            display:inline-block;
            padding:12px 30px;
            background:#667eea;
            color:#fff;
            border-radius:12px;
            text-decoration:none;
            font-weight:600;
            transition:0.3s;
        }
        .offline-container .btn:hover{
            background:#5a67d8;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📡</div>
        <h1>غير متصل بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالشبكة. يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.</p>
        <a href="/" class="btn">المحاولة مرة أخرى</a>
    </div>
</body>
</html>
